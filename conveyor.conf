// Conveyor configuration for packaging the Forge desktop client into native
// Windows, macOS and Linux downloads from a single (Linux) machine.
// Run locally with: conveyor make site
// In CI this is driven by .github/workflows/conveyor-snapshot.yml.
// Docs: https://conveyor.hydraulic.dev

// Bundle an Eclipse Temurin 21 runtime for every target platform (matches the
// JDK vendor Forge's CI builds with). This supplies the per-platform JVM inputs
// Conveyor needs alongside the fat jar.
include required("/stdlib/jdk/21/eclipse.conf")

app {
  display-name = "Forge"
  fsname = "forge"
  rdns-name = "org.cardforge.forge"
  version = "2.0.13"
  vendor = "Card Forge"
  license = "GPL-3.0"

  // Open-source project: this both derives the GitHub Releases update site and
  // unlocks the free-for-OSS license tier.
  vcs-url = "github.com/Card-Forge/forge"

  icons = "AppIcon.png"

  // The desktop client is a Swing GUI app launched as a plain fat jar; see
  // forge.sh / forge.cmd in the IzPack distribution for the original command.
  jvm {
    gui.main-class = "forge.view.Main"
    options = [
      "-Xmx4096m"
      "-Dio.netty.tryReflectionSetAccessible=true"
      "-Dfile.encoding=UTF-8"
    ]
  }

  // The CI workflow copies the versioned fat jar to this stable name so the
  // config does not depend on the project version string.
  inputs = [
    "forge-gui-desktop/target/forge.jar"
    {
      from = "forge-gui/res"
      to = "res"
    }
  ]
}

conveyor.compatibility-level = 18
