name: jpackage Desktop Snapshot

# Builds native desktop installers with jpackage on each platform's own runner
# (Windows .exe, macOS .dmg, Linux .deb), each bundling a JRE, and keeps the existing
# portable .tar.bz2 alongside them. No IzPack jar is published here.
#
# Versioning is deliberately split (see the `version` job):
#   * app-version  = <major>.<minor>.<YYDDD>  -- an invisible, monotonic MSI/deb upgrade key,
#                    so each day's install cleanly upgrades the previous one.
#   * human version = <release>-SNAPSHOT  -- the release anchor; used for the installer filenames
#                    and version.txt. Stable across a release cycle, so each run replaces the
#                    previous file (no accumulation). The app already reports this from its jar
#                    manifest, untouched.
#
# Each runner builds the fat jars (Linux also builds forge-installer for the tarball), then
# .github/scripts/jpackage.sh produces the installer and renames it to the human version.
# The publish wipes and re-adds the rolling release each run (removeArtifacts: true), matching
# today's snapshot workflow, so it always holds exactly the latest set. version.txt/build.txt
# are published for the in-app updater. NOTE: in production this must be a single combined
# desktop+Android publish (as snapshot-both-pc-android.yml is today) so the wipe re-adds the APK.

on:
  push:
    branches: [jpackage-desktop-installers]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.v.outputs.app }}
      human: ${{ steps.v.outputs.human }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          VC=$(sed -n 's/.*<versionCode>\(.*\)<\/versionCode>.*/\1/p' pom.xml | head -1)
          # Invisible monotonic upgrade key: <major>.<minor>.<YYDDD> (each field <= 65535, MSI-legal).
          echo "app=${VC%.*}.$(date -u +%y%j)" >> "$GITHUB_OUTPUT"
          # Human-facing version = the release anchor. Stable across a release cycle, so each
          # run replaces the previous installer (no accumulation on the rolling release).
          echo "human=${VC}-SNAPSHOT" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    env:
      FORGE_VERSION: ${{ needs.version.outputs.app }}
      FORGE_HUMAN_VERSION: ${{ needs.version.outputs.human }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install WiX (jpackage's Windows installer backend)
        if: matrix.platform == 'windows'
        run: choco install wixtoolset -y

      - name: Install virtual framebuffer (headless GUI build on Linux)
        if: matrix.platform == 'linux'
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      # Linux builds forge-installer too (for the .tar.bz2 we keep); Windows/mac
      # build only the three fat jars, avoiding IzPack (which Path C drops and
      # which fails on Windows over a Unicode docs filename).
      - name: Build fat jars (+ tarball on Linux)
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            export DISPLAY=":1"; Xvfb :1 -screen 0 800x600x8 &
            mvn -U -B -P windows-linux -pl forge-installer,adventure-editor -am clean install -DskipTests -T 1C
          else
            mvn -U -B -pl forge-gui-desktop,forge-gui-mobile-dev,adventure-editor -am clean install -DskipTests -T 1C
          fi

      - name: Assemble jpackage input (three fat jars + res, cardsfolder zipped)
        shell: bash
        run: |
          REPO="$PWD"
          mkdir -p jpkg/input/res/cardsfolder
          cp forge-gui-desktop/target/forge-gui-desktop-*-jar-with-dependencies.jar jpkg/input/
          cp forge-gui-mobile-dev/target/forge-gui-mobile-dev-*-jar-with-dependencies.jar jpkg/input/
          cp adventure-editor/target/adventure-editor-jar-with-dependencies.jar jpkg/input/
          # Ship cardsfolder as a single zip (matches the IzPack/dmg builds; Forge reads
          # res/cardsfolder/cardsfolder.zip). Removes ~30k loose files that dominate
          # jpackage packaging time on macOS/Windows.
          for item in forge-gui/res/*; do
            [ "$(basename "$item")" = "cardsfolder" ] && continue
            cp -r "$item" jpkg/input/res/
          done
          ( cd forge-gui/res/cardsfolder && jar cMf "$REPO/jpkg/input/res/cardsfolder/cardsfolder.zip" . )

      - name: jpackage
        shell: bash
        run: bash .github/scripts/jpackage.sh ${{ matrix.platform }}

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp jpkg/out/* dist/ 2>/dev/null || true
          # The tarball and the build timestamp (for the updater) only need to come from one
          # runner; the Linux job already builds forge-installer.
          if [ "${{ matrix.platform }}" = "linux" ]; then
            cp forge-installer/target/*.tar.bz2 dist/ 2>/dev/null || true
            cp forge-gui-desktop/target/classes/build.txt dist/ 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Write version.txt (human version the in-app updater resolves)
        run: echo "${{ needs.version.outputs.human }}" > dist/version.txt

      - name: Move rolling daily-snapshots tag
        run: |
          git tag -f daily-snapshots "$GITHUB_SHA"
          git push origin -f daily-snapshots

      - name: Publish installers + tarball to daily-snapshots
        uses: ncipollo/release-action@v1
        with:
          name: jpackage Daily Snapshot
          tag: daily-snapshots
          prerelease: true
          artifacts: dist/**/*
          allowUpdates: true
          removeArtifacts: true
