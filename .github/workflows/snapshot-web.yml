name: Create Web GUI Snapshot

on:
  push:
    branches: [forge-gui-web]
  workflow_dispatch:

# A push that arrives during a build waits for it, then finds today's snapshot already published
concurrency:
  group: web-snapshot

env:
  TAG: web-snapshot

jobs:
  due:
    if: github.repository == 'MostCromulent/forge'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Build once per UTC day, or whenever run by hand
        id: check
        run: |
          last=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt[0:10]' 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$last" != "$(date -u +%F)" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: due
    if: needs.due.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install virtual framebuffer (if not available) to allow running GUI on a headless server
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - name: Build and test
        run: |
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -U -B -Pweb -pl forge-gui-web -am install -Drun.stress.tests=true

      # The jar looks for lib/ and res/ beside it. The web GUI has no Adventure mode, so its assets stay out.
      - name: Package
        run: |
          mkdir -p dist/forge-web
          cp forge-gui-web/target/forge-gui-web.jar dist/forge-web/
          cp -r forge-gui-web/target/lib dist/forge-web/lib
          rsync -a --exclude adventure forge-gui/res dist/forge-web/
          (cd dist && zip -q -r forge-web.zip forge-web)

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          Forge in a web browser with a modern interface. The host runs a small server on their computer. Players join by web link with no further install required. See the [README](https://github.com/@REPO@/blob/@SHA@/README.md) for what you can play and how to set up a game.

          This is an unofficial test build from the `forge-gui-web` branch of this fork, not a Card-Forge release. It is rebuilt at most once a day.

          **Built** @DATE@ from `@SHORT@`.

          ## Starting it

          1. Install Java 17 or newer.
          2. Download `forge-web.zip` below and unzip it anywhere.
          3. Open `forge-gui-web.jar`, or run `java -jar forge-gui-web.jar` in that folder.

          The game opens in your browser, along with a server window. Keep that window open while you play.

          ## Good to know

          The web build uses the same user folder as desktop Forge, so your decks and settings are shared between the two. If you already play desktop Forge, you may want to back that up first: `%APPDATA%\Forge` on Windows, `~/Library/Application Support/Forge` on macOS, `~/.forge` on Linux.

          Invite links aren't encrypted, and anyone who has one can join. Only send them to people you're playing with, and keep the host's link to yourself.
          EOF
          sed -i -e "s|@REPO@|$GITHUB_REPOSITORY|" -e "s|@SHA@|$GITHUB_SHA|" \
            -e "s|@SHORT@|${GITHUB_SHA:0:11}|" -e "s|@DATE@|$(date -u +%F)|" notes.md

      - name: Replace the snapshot release
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" dist/forge-web.zip --prerelease --target "$GITHUB_SHA" \
            --title "Forge Web GUI (pre-release)" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
