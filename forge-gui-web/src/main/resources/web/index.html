<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/start.css">
<link rel="stylesheet" href="css/lobby.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/hand.css">
<link rel="stylesheet" href="css/prompt.css">
<link rel="stylesheet" href="css/dialogs.css">
</head>
<body>
<main id="menu" hidden></main>
<main id="lobby" hidden></main>
<main id="match" hidden>
  <section id="opponent" class="seat"></section>
  <div id="sky" hidden></div>
  <section id="phase-strip"></section>
  <section id="me" class="seat"></section>
  <aside id="side" data-log="open" data-chat="shut">
    <section class="side-panel" id="log-panel">
      <button class="side-toggle" data-panel="log">Log</button>
      <div id="log"></div>
    </section>
    <section class="side-panel" id="chat-panel" hidden>
      <div id="match-chat"></div>
    </section>
    <section id="prompt"></section>
  </aside>
  <section id="stack" hidden></section>
  <section id="hand"></section>
  <section id="zones"></section>
  <canvas id="overlay"></canvas>
  <div id="zoom" hidden></div>
  <div id="game-over" hidden></div>
</main>
<div id="dock"></div>
<div id="dialog-layer"></div>
<div id="notices"></div>
<div id="banner" hidden>Reconnecting…</div>
<!-- The halo around a card you may play from another zone. Noise pushes its edge about: the two frequencies walk
     a closed loop, so the field keeps changing in one direction and the fifteen-second seam falls nowhere. Three
     copies at different points in that loop, handed out by position in the hand, so a row of them is never in step. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
  <filter id="zone-warp-a" x="-60%" y="-60%" width="220%" height="220%">
    <feTurbulence type="turbulence" baseFrequency="0.058 0.068" numOctaves="3" seed="2" result="n">
      <animate attributeName="baseFrequency" dur="15s" repeatCount="indefinite"
        values="0.058 0.068; 0.055 0.074; 0.048 0.077; 0.041 0.074; 0.038 0.068; 0.041 0.062; 0.048 0.059; 0.055 0.062; 0.058 0.068"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="zone-warp-b" x="-60%" y="-60%" width="220%" height="220%">
    <feTurbulence type="turbulence" baseFrequency="0.041 0.074" numOctaves="3" seed="5" result="n">
      <animate attributeName="baseFrequency" dur="15s" repeatCount="indefinite" begin="-5s"
        values="0.058 0.068; 0.055 0.074; 0.048 0.077; 0.041 0.074; 0.038 0.068; 0.041 0.062; 0.048 0.059; 0.055 0.062; 0.058 0.068"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="zone-warp-c" x="-60%" y="-60%" width="220%" height="220%">
    <feTurbulence type="turbulence" baseFrequency="0.048 0.059" numOctaves="3" seed="9" result="n">
      <animate attributeName="baseFrequency" dur="15s" repeatCount="indefinite" begin="-10s"
        values="0.058 0.068; 0.055 0.074; 0.048 0.077; 0.041 0.074; 0.038 0.068; 0.041 0.062; 0.048 0.059; 0.055 0.062; 0.058 0.068"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<script type="module" src="js/app.js"></script>
</body>
</html>
